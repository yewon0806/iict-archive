<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Creative Coding Archive</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f6f5f2; color: #252625; font-family: Arial, "Malgun Gothic", sans-serif; }
    .wrap { max-width: 830px; margin: 0 auto; padding: 96px 24px; }
    .eyebrow { font-size: 13px; letter-spacing: .12em; color: #777; font-weight: bold; }
    h1 { font-size: clamp(32px, 6vw, 56px); letter-spacing: -.05em; line-height: 1.2; margin: 14px 0 14px; }
    .intro { color: #666; line-height: 1.8; margin: 0 0 42px; }
    .projects { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    .card { display: block; text-decoration: none; color: inherit; padding: 28px; min-height: 170px; background: #fff; border: 1px solid #e5e2dd; border-radius: 16px; transition: transform .18s, box-shadow .18s; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 10px 24px rgba(0,0,0,.07); }
    .number { display: inline-block; color: #888; font-size: 13px; margin-bottom: 38px; }
    .card h2 { margin: 0; font-size: 23px; letter-spacing: -.03em; }
    .card p { margin: 12px 0 0; color: #777; font-size: 14px; }
    footer { padding-top: 48px; color: #999; font-size: 12px; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="eyebrow">2026 · INFORMATION CULTURE TECHNOLOGY</div>
    <h1>My Creative<br>Coding Archive</h1>
    <p class="intro">2026-2 정보문화기술입문 수업에서 만든 코딩 과제 모음입니다.<br>아래 프로젝트를 클릭하면 작품을 볼 수 있습니다.</p>
    <div class="projects">
      <a class="card" href="assignment1/">
        <span class="number">01 / PROJECT</span>
        <h2>Assignment 1</h2>
        <p>Photo →</p>
      </a>
      <a class="card" href="assignment2/">
        <span class="number">02 / PROJECT</span>
        <h2>Assignment 2</h2>
        <p>Random →</p>
      </a>
    </div>
    <footer>Creative Coding Archive · 2026</footer>
  </main>
</body>
</html>
